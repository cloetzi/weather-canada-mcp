name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps version.rb and the lockfile's PATH entry but not its CHECKSUMS entry, which makes a frozen
  # bundle install (the Docker build, CI) fail on the release PR's merge commit. Fix the lockfile on the PR branch.
  sync-lockfile:
    name: Sync Gemfile.lock in the release PR
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - name: Set the lockfile's own version to version.rb's
        run: |
          version=$(sed -nE 's/^ *VERSION = "([^"]+)".*/\1/p' lib/weather_canada_mcp/version.rb)
          sed -i -E "s/^  (weather-canada-mcp) \([^)]*\)$/  \1 (${version})/" Gemfile.lock
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync Gemfile.lock with the release version"
          git push

  # Runs here rather than on the tag: tags created with GITHUB_TOKEN do not trigger other workflows.
  image:
    name: Publish release image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-image.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      version: ${{ needs.release-please.outputs.version }}
      tags: |
        type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
        type=raw,value=latest

  # Gems go to GitHub Packages only.
  gem:
    name: Publish gem
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
      - run: gem build weather-canada-mcp.gemspec
      - name: Push to GitHub Packages
        run: gem push --host https://rubygems.pkg.github.com/cloetzi "weather-canada-mcp-${VERSION}.gem"
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          GEM_HOST_API_KEY: ${{ secrets.GITHUB_TOKEN }}
