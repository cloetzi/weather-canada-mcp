name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs here rather than on the tag: tags created with GITHUB_TOKEN do not trigger other workflows.
  image:
    name: Publish release image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-image.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      version: ${{ needs.release-please.outputs.version }}
      tags: |
        type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
        type=raw,value=latest

  # Gems go to GitHub Packages only for now (RubyGems.org later).
  gem:
    name: Publish gem
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      - run: gem build weather-canada-mcp.gemspec
      - name: Push to GitHub Packages
        run: gem push --host https://rubygems.pkg.github.com/cloetzi "weather-canada-mcp-${VERSION}.gem"
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          GEM_HOST_API_KEY: ${{ secrets.GITHUB_TOKEN }}
