name: Canary

# Weekly checks that do not belong in PR checks. The canary calls every ECCC tool once against the real services
# (about 40 requests through the rate limiter, with the project's User-Agent) to notice upstream changes early;
# Avalanche Canada tools are off by default and are never exercised. The audit re-checks Gemfile.lock against
# advisories published since the last change.
on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  canary:
    name: Live tool canary
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true
      - run: bin/canary

  audit:
    name: Dependency advisories
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: --lockfile=Gemfile.lock
