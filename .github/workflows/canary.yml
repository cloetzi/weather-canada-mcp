name: Canary

# Calls every ECCC tool once against the real services (about 40 requests through the rate limiter, with the
# project's User-Agent) to notice upstream changes early. Deliberately not part of PR checks. Avalanche Canada
# tools are off by default and are never exercised.
on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  canary:
    name: Live tool canary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
      - run: bin/canary
